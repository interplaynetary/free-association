name: free-association
region: nyc
services:
  - name: web
    # DigitalOcean App Platform configuration
    environment_slug: node-js
    github:
      repo: your-username/free-association
      branch: main
      deploy_on_push: true
    
    # Build configuration
    build_command: BUILD_TARGET=server npm install && npm run build:server
    
    # Run command - points to the server build
    run_command: node build-server/index.js
    
    # Environment variables
    envs:
      - key: NODE_ENV
        value: "production"
    
    # Health check
    health_check:
      http_path: /
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    
    # Resources
    instance_count: 1
    instance_size_slug: basic-xxs
    
    # Source directory
    source_dir: /


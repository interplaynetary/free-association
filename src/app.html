<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-title" content="Playnet">
	<meta name="apple-touch-fullscreen" content="yes">
	<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png">
	<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/favicon.png">
	<link rel="apple-touch-icon" sizes="167x167" href="%sveltekit.assets%/favicon.png">
	<link rel="apple-touch-startup-image" href="%sveltekit.assets%/favicon.png">
	<meta name="format-detection" content="telephone=no">
	%sveltekit.head%
</head>


<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

<style>
	* {
		box-sizing: border-box;

		/* disable text selection (svg icons are also text...) */
		-webkit-user-select: none;
		/* Safari */
		-ms-user-select: none;
		/* IE 10 and IE 11 */
		user-select: none;
		/* Standard syntax */

		/* preventing the long press context menu, https://stackoverflow.com/a/56866766/3022127 */
		-webkit-touch-callout: none !important;
		-webkit-user-select: none !important;

		/* preventing iOS tap highlight */
		-webkit-tap-highlight-color: transparent;

		/* Disable browser handling of all panning and zooming gestures, except for regular scrolling */
		touch-action: pan-y;
	}
</style>

</html>

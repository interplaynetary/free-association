# Android Build Workflow (Fastlane)
#
# REQUIRED SECRETS:
# - RELEASE_KEYSTORE: Base64 encoded Android Release Keystore
# - RELEASE_KEYSTORE_PASSWORD: Password for the keystore
#
name: Build Android

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install
          bundle install

      - name: Build Svelte app
        run: bun run build:static

      - name: Capacitor Sync
        run: bunx cap sync android

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > android/release.decrypted.jks

      - name: Fastlane Build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          cd android
          bundle exec fastlane build

      - name: Upload release bundle
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: output/app-release.aab
          retention-days: 60
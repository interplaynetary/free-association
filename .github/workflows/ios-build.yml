# iOS Build Workflow (Fastlane)
#
# REQUIRED SECRETS:
# - MATCH_GIT_URL: URL to the private git repo for Match
# - MATCH_PASSWORD: Password to decrypt the Match repo
# - MATCH_KEYCHAIN_PASSWORD: Password for the local keychain (can be technically anything)
#
name: Build iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    name: Build iOS app
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup XCode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 14.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install
          bundle install

      - name: Build project app
        run: bun run build

      - name: Capacitor Sync
        run: bunx cap sync ios

      - name: Fastlane Build
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          MATCH_READONLY: true
        run: |
          cd ios
          bundle exec fastlane build

      - name: Upload release bundle
        uses: actions/upload-artifact@v3
        with:
          name: app-ios
          path: output/App.ipa
          retention-days: 60
